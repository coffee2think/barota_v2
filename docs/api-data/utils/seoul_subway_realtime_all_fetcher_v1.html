<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울 지하철 실시간 도착정보 전체 수집기</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }
    body {
      margin: 0;
      background: #111827;
      color: #f9fafb;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }
    p {
      margin: 6px 0;
      color: #d1d5db;
      line-height: 1.55;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background: #111827;
      color: #f9fafb;
      font-size: 15px;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary {
      background: #2563eb;
      color: #fff;
    }
    button.secondary {
      background: #374151;
      color: #fff;
    }
    button.danger {
      background: #b91c1c;
      color: #fff;
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .stat {
      background: #111827;
      border-radius: 12px;
      padding: 14px;
    }
    .stat .label {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .stat .value {
      font-size: 22px;
      font-weight: 800;
    }
    progress {
      width: 100%;
      height: 18px;
      margin-top: 12px;
    }
    pre {
      max-height: 380px;
      overflow: auto;
      background: #0b1220;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #374151;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
    }
    .ok { color: #86efac; }
    .error { color: #fca5a5; }
    .muted { color: #9ca3af; }
    code { color: #bfdbfe; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>서울 지하철 실시간 도착정보 전체 수집기</h1>
    <p>
      <code>realtimeStationArrival/ALL</code> API를 최대 1000건씩 반복 호출하여
      전체 <code>realtimeArrivalList</code>를 하나의 JSON으로 합칩니다.
    </p>
  </div>

  <div class="card">
    <label for="apiKey">서울 열린데이터광장 API Key</label>
    <input
      id="apiKey"
      type="password"
      autocomplete="off"
      placeholder="API Key를 입력하세요"
    />

    <div class="row">
      <button id="fetchBtn" class="primary">전체 데이터 조회</button>
      <button id="cancelBtn" class="danger" disabled>중단</button>
      <button id="downloadBtn" class="secondary" disabled>JSON 다운로드</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="label">전체 데이터 수</div>
        <div id="totalCount" class="value">-</div>
      </div>
      <div class="stat">
        <div class="label">수집 완료</div>
        <div id="loadedCount" class="value">0</div>
      </div>
      <div class="stat">
        <div class="label">요청 진행</div>
        <div id="requestCount" class="value">0 / 0</div>
      </div>
    </div>

    <progress id="progress" value="0" max="1"></progress>
    <p id="status" class="muted">대기 중</p>
  </div>

  <div class="card">
    <h2>결과 미리보기</h2>
    <p class="muted">완료되면 합쳐진 JSON의 앞부분을 보여줍니다.</p>
    <pre id="preview">아직 데이터가 없습니다.</pre>
  </div>
</div>

<script>
(() => {
  const BASE_URL = "http://swopenAPI.seoul.go.kr/api/subway";
  const SERVICE_PATH = "json/realtimeStationArrival/ALL";
  const PAGE_SIZE = 1000;

  const apiKeyInput = document.getElementById("apiKey");
  const fetchBtn = document.getElementById("fetchBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const downloadBtn = document.getElementById("downloadBtn");

  const totalCountEl = document.getElementById("totalCount");
  const loadedCountEl = document.getElementById("loadedCount");
  const requestCountEl = document.getElementById("requestCount");
  const progressEl = document.getElementById("progress");
  const statusEl = document.getElementById("status");
  const previewEl = document.getElementById("preview");

  let abortController = null;
  let combinedJson = null;

  function makeUrl(apiKey, startIndex, endIndex) {
    return `${BASE_URL}/${encodeURIComponent(apiKey)}/${SERVICE_PATH}/${startIndex}/${endIndex}`;
  }

  function setStatus(message, type = "muted") {
    statusEl.textContent = message;
    statusEl.className = type;
  }

  function resetUi() {
    combinedJson = null;
    downloadBtn.disabled = true;
    totalCountEl.textContent = "-";
    loadedCountEl.textContent = "0";
    requestCountEl.textContent = "0 / 0";
    progressEl.value = 0;
    progressEl.max = 1;
    previewEl.textContent = "조회 중...";
  }

  function validateResponse(data) {
    if (!data || typeof data !== "object") {
      throw new Error("응답이 올바른 JSON 객체가 아닙니다.");
    }

    const errorMessage = data.errorMessage;

    if (!errorMessage) {
      throw new Error("응답에 errorMessage가 없습니다.");
    }

    if (errorMessage.code && errorMessage.code !== "INFO-000") {
      throw new Error(
        `API 오류: ${errorMessage.message || "알 수 없는 오류"} (${errorMessage.code})`
      );
    }

    if (!Array.isArray(data.realtimeArrivalList)) {
      throw new Error("응답에 realtimeArrivalList 배열이 없습니다.");
    }
  }

  async function requestPage(apiKey, startIndex, endIndex) {
    const url = makeUrl(apiKey, startIndex, endIndex);

    let response;
    try {
      response = await fetch(url, {
        method: "GET",
        signal: abortController.signal,
        cache: "no-store"
      });
    } catch (error) {
      if (error.name === "AbortError") throw error;

      throw new Error(
        "API 요청 자체가 실패했습니다. 브라우저 콘솔에 CORS 관련 오류가 보인다면 " +
        "HTML 단독 호출이 차단된 것입니다.\n\n원인: " + error.message
      );
    }

    if (!response.ok) {
      throw new Error(`HTTP 오류: ${response.status} ${response.statusText}`);
    }

    let data;
    try {
      data = await response.json();
    } catch {
      throw new Error("서버 응답을 JSON으로 읽을 수 없습니다.");
    }

    validateResponse(data);
    return data;
  }

  async function fetchAll() {
    const apiKey = apiKeyInput.value.trim();

    if (!apiKey) {
      alert("API Key를 입력하세요.");
      apiKeyInput.focus();
      return;
    }

    resetUi();

    fetchBtn.disabled = true;
    cancelBtn.disabled = false;
    apiKeyInput.disabled = true;
    abortController = new AbortController();

    try {
      setStatus("첫 번째 1000건을 조회하고 있습니다...");

      const firstStart = 0;
      const firstEnd = PAGE_SIZE - 1;
      const firstData = await requestPage(apiKey, firstStart, firstEnd);

      const total = Number(firstData.errorMessage.total);

      if (!Number.isFinite(total) || total < 0) {
        throw new Error("errorMessage.total 값을 정상적으로 읽을 수 없습니다.");
      }

      totalCountEl.textContent = total.toLocaleString();

      const totalRequests = Math.max(1, Math.ceil(total / PAGE_SIZE));
      progressEl.max = totalRequests;

      const mergedList = [...firstData.realtimeArrivalList];

      let completedRequests = 1;
      requestCountEl.textContent = `${completedRequests} / ${totalRequests}`;
      loadedCountEl.textContent = mergedList.length.toLocaleString();
      progressEl.value = completedRequests;

      for (let requestIndex = 1; requestIndex < totalRequests; requestIndex++) {
        const startIndex = requestIndex * PAGE_SIZE;
        const endIndex = Math.min(startIndex + PAGE_SIZE - 1, total - 1);

        setStatus(
          `${startIndex.toLocaleString()} ~ ${endIndex.toLocaleString()} 구간 조회 중...`
        );

        const pageData = await requestPage(apiKey, startIndex, endIndex);
        mergedList.push(...pageData.realtimeArrivalList);

        completedRequests++;
        requestCountEl.textContent = `${completedRequests} / ${totalRequests}`;
        loadedCountEl.textContent = mergedList.length.toLocaleString();
        progressEl.value = completedRequests;
      }

      combinedJson = {
        ...firstData,
        errorMessage: {
          ...firstData.errorMessage,
          total: total
        },
        realtimeArrivalList: mergedList
      };

      previewEl.textContent = JSON.stringify(combinedJson, null, 2).slice(0, 30000);
      if (JSON.stringify(combinedJson).length > 30000) {
        previewEl.textContent += "\n\n... 미리보기는 일부만 표시됩니다.";
      }

      downloadBtn.disabled = false;
      setStatus(
        `완료: 총 ${mergedList.length.toLocaleString()}개 데이터를 수집했습니다.`,
        "ok"
      );
    } catch (error) {
      if (error.name === "AbortError") {
        setStatus("사용자가 요청을 중단했습니다.", "error");
        previewEl.textContent = "요청이 중단되었습니다.";
      } else {
        console.error(error);
        setStatus(error.message, "error");
        previewEl.textContent = error.stack || error.message;
      }
    } finally {
      fetchBtn.disabled = false;
      cancelBtn.disabled = true;
      apiKeyInput.disabled = false;
      abortController = null;
    }
  }

  function getTimestamp() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");

    return (
      String(now.getFullYear()).slice(-2) +
      pad(now.getMonth() + 1) +
      pad(now.getDate()) +
      pad(now.getHours()) +
      pad(now.getMinutes()) +
      pad(now.getSeconds())
    );
  }

  function downloadJson() {
    if (!combinedJson) return;

    const blob = new Blob(
      [JSON.stringify(combinedJson, null, 2)],
      { type: "application/json;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download =
      `swopenapi.seoul.go.kr_api_subway_apiKey_json_realtimeStationArrival_ALL_${getTimestamp()}.json`;

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);
  }

  fetchBtn.addEventListener("click", fetchAll);

  cancelBtn.addEventListener("click", () => {
    if (abortController) {
      abortController.abort();
    }
  });

  downloadBtn.addEventListener("click", downloadJson);

  apiKeyInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !fetchBtn.disabled) {
      fetchAll();
    }
  });
})();
</script>
</body>
</html>
